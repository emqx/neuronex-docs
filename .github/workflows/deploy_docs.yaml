name: Deploy Docs

concurrency: 
  group: ${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    tags:
      - v*
    branches:
      - main
      - ci

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'emqx'
    steps:
    - name: clone docs
      uses: actions/checkout@main
      with:
        fetch-depth: 0
        path: docs-files

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
      with:
        app-id: ${{ vars.AUTH_APP_ID }}
        private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}

    - name: clone frontend
      uses: actions/checkout@main
      with:
        repository: 'emqx/docs-emqx-com-frontend'
        ref: next
        token: ${{ steps.app-token.outputs.token }}
        path: frontend

    - name: use node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: 'frontend/.nvmrc'

    - name: use pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json

    - name: use python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
        architecture: 'x64'

    - name: set env
      run: |
         BRANCH=$(echo ${{ github.ref }} | sed -r  "s ^refs/heads/|^refs/tags/(.*) \1 g")
         if [ "$BRANCH" = "main" ];then
         VERSION="latest"
         else
         VERSION=$BRANCH
         fi
         echo "DOCS_BRANCH=$BRANCH" >> $GITHUB_ENV
         echo "VERSION=$VERSION" >> $GITHUB_ENV
         echo "DOCS_TYPE=emqx-neuron" >> $GITHUB_ENV

    - name: install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: test link checker
      run: node docs-files/.github/scripts/check-links.test.cjs "$GITHUB_WORKSPACE/frontend"

    - name: build committed docs and API references
      run: python3 docs-files/.github/scripts/build_docs.py --source docs-files --frontend frontend --version "$VERSION"

    - name: verify version artifacts
      run: >-
        python3 docs-files/.github/scripts/verify_build.py
        --sources docs-files --dist frontend/docs/.vitepress/dist
        --version "$VERSION" --output link-audit/artifacts.json

    - name: check generated links and external URLs
      run: >-
        node docs-files/.github/scripts/check-links.cjs
        --frontend frontend --sources docs-files
        --dist frontend/docs/.vitepress/dist --version "$VERSION"
        --output link-audit

    - name: save build provenance and link report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docs-validation-${{ env.VERSION }}
        path: |
          frontend/build-provenance.json
          link-audit/artifacts.json
          link-audit/report.json
          link-audit/inventory.json
          link-audit/http-results.jsonl

    - name: save validated output
      uses: actions/upload-artifact@v4
      with:
        name: docs-dist-${{ env.VERSION }}
        path: frontend/docs/.vitepress/dist/
        retention-days: 14

    - name: set aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: copy previous objects affected by this deployment
      run: |
        pip3 install boto3
        python3 docs-files/.github/scripts/backup_s3_test.py
        python3 docs-files/.github/scripts/backup_s3.py \
          --bucket docs-emqx-com --dist frontend/docs/.vitepress/dist \
          --product "$DOCS_TYPE" --version "$VERSION" --output previous-dist

    - name: save previous published version
      uses: actions/upload-artifact@v4
      with:
        name: docs-previous-${{ env.VERSION }}
        include-hidden-files: true
        path: previous-dist/
        if-no-files-found: ignore
        retention-days: 14

    - name: upload dist to s3
      run: |
        aws s3 rm --recursive s3://docs-emqx-com/zh/${DOCS_TYPE}/${VERSION} || true
        aws s3 rm --recursive s3://docs-emqx-com/en/${DOCS_TYPE}/${VERSION} || true
        aws s3 cp --recursive --exclude "*.md" frontend/docs/.vitepress/dist/ s3://docs-emqx-com/
        aws s3 cp --recursive --exclude "*" --include "*.md" --content-type "text/markdown; charset=utf-8" frontend/docs/.vitepress/dist/ s3://docs-emqx-com/
        aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_DOCS_CLOUDFRONT_ID }} --paths "/zh/${DOCS_TYPE}/${VERSION}/*" "/en/${DOCS_TYPE}/${VERSION}/*" "/api/${DOCS_TYPE}_versions.json" "/sitemap_${DOCS_TYPE}_${VERSION}.xml"

    - name: upload dist to cos
      run: |
        curl -fsSL -o /tmp/coscli https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
        chmod +x /tmp/coscli
        /tmp/coscli config set --secret_id ${{ secrets.TENCENT_COS_ID }} --secret_key ${{ secrets.TENCENT_COS_KEY }} --init-skip
        /tmp/coscli config add -b docs-1302406139 -e cos.accelerate.myqcloud.com -a docs-bucket
        for lang in en zh; do
          /tmp/coscli rm -r -f cos://docs-bucket/${lang}/${DOCS_TYPE}/${VERSION}/ || true
        done

        cd frontend/docs/.vitepress/dist/
        /tmp/coscli cp -r --disable-log --process-log=false --routines 20 --fail-output-path /tmp/coscli_output --meta "Content-Type:text/markdown; charset=utf-8" --include ".*\.md$" ./ cos://docs-bucket/
        /tmp/coscli cp -r --disable-log --process-log=false --routines 20 --fail-output-path /tmp/coscli_output --exclude ".*\.md$" ./ cos://docs-bucket/

    - name: flush cdn
      run: |
        pip3 install tccli
        tccli configure set secretId ${{ secrets.TENCENT_COS_ID }}
        tccli configure set secretKey ${{ secrets.TENCENT_COS_KEY }}
        tccli configure set region ap-shanghai
        tccli cdn PurgePathCache --cli-unfold-argument --Paths https://docs.emqx.com/zh/${DOCS_TYPE}/${VERSION}/ https://docs.emqx.com/en/${DOCS_TYPE}/${VERSION}/ --FlushType delete
        tccli cdn PurgeUrlsCache --cli-unfold-argument --Urls https://docs.emqx.com/api/${DOCS_TYPE}_versions.json https://docs.emqx.com/sitemap_${DOCS_TYPE}_${VERSION}.xml

    - name: update search index
      uses: emqx/docsearch-scraper@main
      env:
        APPLICATION_ID: ${{ secrets.ALGOLIA_APPLICATION_ID_NEXT }}
        API_KEY: ${{ secrets.ALGOLIA_API_KEY_NEXT }}
      with:
        docs_type: ${{ env.DOCS_TYPE }}
        docs_version: ${{ env.VERSION }}
